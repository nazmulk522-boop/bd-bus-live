<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>বাংলাদেশ বাস লাইভ - Bangladesh Bus Live</title>
    <meta name="description" content="বাংলাদেশের চলন্ত বাসের রিয়েল-টাইম লাইভ জিপিএস লোকেশন ট্র্যাকিং প্ল্যাটফর্ম - Developed by Nazmul IT" />
    <meta property="og:title" content="Bangladesh Bus Live - বাংলাদেশ বাস লাইভ" />
    <meta property="og:description" content="বাসে থাকা যেকোনো ব্যক্তির স্মার্টফোন থেকে লাইভ লোকেশন ব্রডকাস্ট ও ট্র্যাকিং।" />
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="বাস লাইভ" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body class="font-['Hind_Siliguri','Plus_Jakarta_Sans',sans-serif] bg-slate-50 text-slate-900 antialiased selection:bg-rose-500 selection:text-white">
    <div id="root"></div>
    <script>
      // Automatic recovery if stale cache causes a blank white screen
      window.addEventListener('load', function() {
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && (!root.firstElementChild || root.innerHTML.trim() === '')) {
            console.warn('Blank screen detected, clearing cache and auto-refreshing...');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
              });
            }
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
            window.location.reload();
          }
        }, 3000);
      });

      // Auto-reload on dynamic import / chunk errors when a new version is published
      window.addEventListener('error', function(e) {
        if (e && e.message && (
          e.message.indexOf('dynamically imported module') !== -1 ||
          e.message.indexOf('Failed to fetch dynamically imported module') !== -1 ||
          e.message.indexOf('Loading chunk') !== -1
        )) {
          window.location.reload();
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
